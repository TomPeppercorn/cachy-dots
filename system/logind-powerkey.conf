# cachy-dots · make the power button sleep instead of shutting down.
# Installed to /etc/systemd/logind.conf.d/60-cachy-dots-powerkey.conf on laptops.
# A short press suspends; holding the button still powers off. Delete this file to restore
# the default (short press = shut down). Takes effect after a reboot.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
