# cachy-dots · hypridle
# Locks after 10 min idle, suspends after 30. Media playback / fullscreen games inhibit idle.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
